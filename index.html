<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX Automation Audit</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="env-flag"></div>

<!-- Fixed 1440x900 stage, scaled to fit whatever screen it lands on. A kiosk
     wants the design to hold exactly, not to reflow into shapes nobody drew. -->
<div id="viewport">
  <div id="stage">
    <div id="app"></div>
    <div class="overlay" id="staff-menu"></div>
    <div class="overlay" id="idle-prompt"></div>
  </div>
</div>

<!-- Classic scripts in dependency order. No ES modules: type="module" is blocked
     on file:// origins, which is where production runs. -->
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/roi.js"></script>
<script src="js/store.js"></script>
<script src="js/screens.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
